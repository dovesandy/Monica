[versions]
agp = "9.0.0"
kotlin = "2.2.20-Beta2"
coroutines = "1.10.2"
immutable = "0.4.0"
serialization = "1.9.0"
ktx = "1.17.0"
lifecycle = "2.10.0-alpha02"
activity = "1.12.0-alpha06"
fragment = "1.8.9"
composeBom = "2025.08.00"
nav3 = "1.0.0-alpha07"
viewmodelNav3 = "1.0.0-alpha04"
junit = "4.13.2"
test-ext = "1.3.0"
test-espresso = "3.7.0"

[libraries]
# KotlinX
kotlinx-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "immutable" }
kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# KTX
androidx-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-bom-alpha = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBom" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
# Compose+
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
fragment-compose = { group = "androidx.fragment", name = "fragment-compose", version.ref = "fragment" }
viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose-android", version.ref = "lifecycle" }
# Nav3
nav3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3" }
viewmodel-nav3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "viewmodelNav3" }
# Test
test-junit = { group = "junit", name = "junit", version.ref = "junit" }
test-ext = { group = "androidx.test.ext", name = "junit", version.ref = "test-ext" }
test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "test-espresso" }
test-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[bundles]
kotlinx = ["kotlinx-coroutines", "kotlinx-reflect", "kotlinx-immutable", "kotlinx-serialization"]
androidx = ["androidx-ktx", "androidx-fragment-ktx", "androidx-lifecycle-ktx"]
compose = ["compose-material3", "compose-ui-tooling-preview", "activity-compose", "fragment-compose",
    "viewmodel-compose", "compose-material3-window-size"]
compose-debug = ["compose-ui-tooling", "test-compose-ui-test-manifest"]
nav3 = ["nav3-ui", "viewmodel-nav3"]
test = ["test-junit"]
test-android = ["test-ext", "test-espresso"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }